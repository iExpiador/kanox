<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanox Space</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Anton&display=swap" rel="stylesheet">

  <!-- Font Awesome para los iconos sociales -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --white-color: #ffffff;
      --ms-3: 0.3s;
    }

    * {
      box-sizing: border-box;
    }

    /* ============================
       BODY con fondo de RAYOS
    ============================ */
    body {
      padding: 0;
      margin: 0;
      display: grid;
      place-content: center;
      background-color: #000;
      height: 100vh;
      font-family: "Montserrat", sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Rayos verticales */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 40px,
          rgba(255,255,255,0.04) 40px,
          rgba(255,255,255,0.04) 41px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 120px,
          rgba(255,255,255,0.08) 120px,
          rgba(255,255,255,0.08) 121px
        );
      animation: lightning 6s ease-in-out infinite;
      z-index: -1;
      pointer-events: none;
    }

    /* Destello de rayo */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse at 50% 0%,
        rgba(255,255,255,0.25) 0%,
        transparent 60%
      );
      animation: flash 7s ease-in-out infinite;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes lightning {
      0%, 90%, 100% { opacity: 0.4; }
      92%, 96%      { opacity: 1; }
    }

    @keyframes flash {
      0%, 88%, 100% { opacity: 0; }
      90%, 94%      { opacity: 1; }
      92%           { opacity: 0.3; }
    }

    /* ============================
       CARD
    ============================ */
    .card {
      position: relative;
      padding: 1px;
      max-width: 300px;
    }

    .card__border {
      border-radius: 10px;
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .card__border::before {
      content: "";
      position: absolute;
      height: 150%;
      width: 0px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
      z-index: -1;
      border: 10px;
      animation: rotate-border 5s linear infinite forwards;
    }

    .card:hover .card__border::before {
      box-shadow: 0 0 200px 100px #ffffff, 0 0 100px 200px #f5f5f5;
    }

    @keyframes rotate-border {
      50% {
        box-shadow: 0 0 40px 60px #ffffff;
      }
      100% {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    .card__content {
      border-radius: 10px;
      background: linear-gradient(
        0deg,
        rgba(6, 6, 6, 1) 0%,
        rgba(22, 22, 22, 1) 50%
      );
      margin: 0;
      color: var(--white-color);
      font-size: 21px;
      overflow: hidden;
    }

    .card__info {
      padding: 20px;
    }

    .card__info-wrapper {
      transform: translateY(50%);
      transition: var(--ms-3);
    }

    .card:hover .card__info-wrapper {
      transform: translateY(0%);
    }

    /* ============================
       FOTO CON COMETA
    ============================ */
    .card__image-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: visible;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      isolation: isolate;
    }

    .card__image-wrapper::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 180deg,
        rgba(255,255,255,0.4) 240deg,
        #ffffff 300deg,
        #ffffff 360deg
      );
      animation: rotate-ring 1.8s linear infinite;
      filter: drop-shadow(0 0 6px #ffffff)
              drop-shadow(0 0 14px #ffffff)
              drop-shadow(0 0 22px #ffffff);
      z-index: 0;
    }

    .card__image-wrapper::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #000;
      z-index: 1;
    }

    .card__image-wrapper img {
      position: relative;
      z-index: 2;
      object-fit: cover;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .card:hover .card__image-wrapper::before {
      filter: drop-shadow(0 0 10px #ffffff)
              drop-shadow(0 0 20px #ffffff)
              drop-shadow(0 0 32px #ffffff);
    }

    @keyframes rotate-ring {
      to {
        transform: rotate(360deg);
      }
    }

    /* Posicionamiento original de imagen y nombre */
    .card__image-wrapper,
    .card__name {
      position: relative;
      transition: 0.3s;
      left: 50%;
      transform: translateX(-50%);
      scale: 1.4;
      transform-origin: left;
    }

    .card:hover .card__image-wrapper {
      scale: 1;
      transform: translateX(0);
      left: 0%;
    }

    /* ============================
       NOMBRE CON DEGRADADO ANIMADO
    ============================ */
    .card__name {
      margin: 0;
      margin-top: 15px;
      font-family: "Anton", sans-serif;
      width: fit-content;
      font-size: 35px;
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #7a7a7a 25%,
        #ffffff 50%,
        #7a7a7a 75%,
        #ffffff 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }

    .card:hover .card__name {
      scale: 1;
      transform: translateX(0);
      left: 0%;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    /* ============================
       DESCRIPCIÓN
    ============================ */
    .card__description {
      font-size: 16px;
      line-height: 1.6;
      font-weight: 300;
      opacity: 0;
      transition: var(--ms-3);
      transition-delay: 0.015s;
    }

    .card:hover .card__description {
      opacity: 1;
    }

    /* ============================
       REDES SOCIALES
    ============================ */
    .card__social {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      margin-top: 10px;
    }

    .card .card__social a {
      display: block;
      opacity: 0;
      transform: translateY(100%);
      color: gray;
      text-decoration: none;
      transition: opacity 0.7s, transform 0.7s, color var(--ms-3),
        text-shadow var(--ms-3);
      transition-delay: 0s, 0s, 0s, 0s;
    }

    .card__social a:nth-child(2) {
      transition-delay: 0.1s, 0.1s, 0s, 0s;
    }

    .card__social a:nth-child(3) {
      transition-delay: 0.2s, 0.2s, 0s, 0s;
    }

    .card__social a:nth-child(4) {
      transition-delay: 0.3s, 0.3s, 0s, 0s;
    }

    .card:hover .card__social a {
      opacity: 1;
      transform: translateY(0%);
    }

    .card__social a:hover {
      color: var(--white-color);
      text-shadow: 0px 0px 10px var(--white-color);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card__border"></div>

    <div class="card__content">
      <div class="card__info">
        <div class="card__info-wrapper">

          <div class="card__info-person">
            <div class="card__image-wrapper">
              <img src="https://xatimg.com/image/i0itFcpCRNkD.jpg" alt="Profile Picture" class="card__image">
            </div>
            <br>
            <h2 class="card__name">𝙆𝙖𝙣𝙤𝙭</h2>
          </div>

          <p class="card__description">
            Mr. Toby is a charming, curious cat with soft fur and a playful spirit. He's always ready for a new adventure, whether it's chasing toys or exploring cozy corners of the house.
          </p>

          <div class="card__social">
            <a href="https://x.com">
              <i class="fa-brands fa-twitter"></i>
            </a>
            <a href="https://www.linkedin.com/">
              <i class="fa-brands fa-linkedin"></i>
            </a>
            <a href="https://www.facebook.com/">
              <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://youtube.com">
              <i class="fa-brands fa-youtube"></i>
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
